; Program settings — INI viewer test set.
[general]
appName = Praxis
windowWidth = 1280
windowHeight = 720
startMaximized = false

[editor]
indentWidth = 2
showLineNumbers = true
fontFamily = JetBrains Mono

[runs]
timeoutSeconds = 30
confirmRunAll = true

[logging]
; comments after values are kept as part of the file
level = info
rotateAfterMb = 50
